<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Wake / Waves -->
  <path d="M 64 360 C 140 330, 200 375, 270 350 C 340 325, 390 355, 448 340" fill="none" stroke="url(#waveGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 96 405 C 160 380, 220 415, 300 395 C 370 375, 410 400, 448 390" fill="none" stroke="#a5f3fc" stroke-width="12" stroke-linecap="round" stroke-opacity="0.8"/>
  <!-- Jet Ski silhouette & tow rope -->
  <g transform="translate(110, 160)">
    <!-- Tow rope extending back -->
    <path d="M 40 100 Q 15 70, -20 50" fill="none" stroke="#fef08a" stroke-width="8" stroke-dasharray="8 6" stroke-linecap="round"/>
    <!-- Rider -->
    <circle cx="175" cy="50" r="24" fill="#ffffff" />
    <!-- Helmet visor -->
    <path d="M 183 45 Q 195 50, 192 60" fill="none" stroke="#0891b2" stroke-width="5" stroke-linecap="round"/>
    <!-- Rider Body -->
    <path d="M 160 76 L 195 80 L 175 125 L 145 115 Z" fill="#ffffff" />
    <path d="M 185 85 L 225 105" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <!-- Jet Ski Body -->
    <path d="M 50 145 L 210 145 L 270 120 L 290 140 L 240 170 L 65 170 Z" fill="#ffffff" />
    <path d="M 120 120 L 210 120 L 245 145 L 105 145 Z" fill="#38bdf8" />
    <path d="M 230 115 L 255 100 L 265 108 L 245 122 Z" fill="#fbbf24" />
    <!-- Water spray -->
    <path d="M 45 155 Q 15 135, -5 145" fill="none" stroke="#cffafe" stroke-width="10" stroke-linecap="round"/>
    <path d="M 40 170 Q 20 160, 5 180" fill="none" stroke="#cffafe" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
